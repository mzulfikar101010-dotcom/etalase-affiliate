<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etalase Affiliate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f5f2;color:#1f1f1f;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.5rem}
input{width:100%;padding:11px 12px;border:1px solid #d6d3cc;border-radius:10px;font-size:1rem;background:#fff}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 5px}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;background:#e9e6df;color:#1f1f1f;text-decoration:none;text-align:center;display:block}
button:disabled{opacity:.5;cursor:wait}
.primary{background:#ee4d2d;color:#fff}
.done{background:#16854a;color:#fff}
.danger{color:#b3261e}
.box{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:18px}
.row{display:flex;gap:8px;margin-top:14px}
.drop{border:2px dashed #bbb6ab;border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:#6b6b6b}
.drop.over,.drop:focus{border-color:#ee4d2d;background:#fff3f0}
.drop img{max-width:160px;max-height:160px;border-radius:10px;display:block;margin:0 auto 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.card .body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:.95rem;overflow-wrap:anywhere;flex:1}
.muted{color:#6b6b6b;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;display:none;max-width:90%;width:max-content}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Etalase Affiliate</h1>
    <button id="adminBtn">Admin</button>
  </header>

  <form id="loginForm" class="box" hidden>
    <label for="password" style="margin-top:0">Password admin</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="row"><button class="primary" id="loginBtn">Masuk</button></div>
  </form>

  <form id="form" class="box" hidden>
    <label for="nama" style="margin-top:0">Nama paket</label>
    <input id="nama" maxlength="150" required>
    <label>Gambar</label>
    <div id="drop" class="drop" tabindex="0" role="button">
      <img id="preview" alt="Pratinjau" hidden>
      <span>Seret gambar ke sini, atau klik untuk memilih</span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <label for="link">Link</label>
    <input id="link" type="url" placeholder="https://..." required>
    <div class="row">
      <button class="primary" id="saveBtn">Simpan</button>
      <button type="button" id="cancelBtn" hidden>Batal</button>
    </div>
  </form>

  <input id="search" type="search" placeholder="Cari nama paket..." aria-label="Cari">
  <div id="list" class="grid"></div>
  <p id="status" class="muted" style="margin-top:14px">Memuat...</p>
</div>
<div id="toast" role="status"></div>

<script>
// ===== TEMPEL URL WEB APP APPS SCRIPT DI SINI =====
const API_URL = 'https://script.google.com/macros/s/AKfycby1PtTPLVHc2YLZtNwzeZnn2zcpW0skginpOxqBl2kYXBG0t5H6lVESf6rpwY-PQk-F/exec';

const $ = id => document.getElementById(id);
let items = [], password = '', editId = null, image = '', loaded = false;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function toast(message) {
  $('toast').textContent = message;
  $('toast').style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ($('toast').style.display = 'none'), 3000);
}

// Tanpa body = ambil data. Dengan body = login, simpan, atau hapus.
async function api(body) {
  const res = await fetch(API_URL, body
    ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }
    : { cache: 'no-store' });
  const data = await res.json();
  if (!data.ok) throw new Error(data.pesan);
  return data.items;
}

const errorText = err => err instanceof TypeError || err instanceof SyntaxError
  ? 'Gagal terhubung. Cek internet dan pengaturan Apps Script.' : err.message;

async function copy(button, text) {
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const area = el('textarea', { value: text });
    document.body.append(area);
    area.select();
    ok = document.execCommand('copy');
    area.remove();
  }
  if (!ok) return prompt('Salin manual link berikut:', text);
  button.textContent = '✓ Tersalin';
  button.classList.add('done');
  clearTimeout(button.timer);
  button.timer = setTimeout(() => { button.textContent = 'Salin Link'; button.classList.remove('done'); }, 1800);
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const shown = items.filter(i => i.nama.toLowerCase().includes(q));
  $('list').replaceChildren(...shown.map(item => {
    const copyBtn = el('button', { className: 'primary', textContent: 'Salin Link' });
    copyBtn.onclick = () => copy(copyBtn, item.link);
    const body = el('div', { className: 'body' }, el('h3', { textContent: item.nama }), copyBtn);
    if (/^https?:\/\//i.test(item.link)) {
      body.append(el('a', { className: 'btn', textContent: 'Buka', href: item.link, target: '_blank', rel: 'noopener noreferrer' }));
    }
    if (password) {
      body.append(
        el('button', { textContent: 'Edit', onclick: () => edit(item) }),
        el('button', { textContent: 'Hapus', className: 'danger', onclick: e => remove(e.target, item) }));
    }
    return el('article', { className: 'card' }, el('img', { src: item.gambar, alt: item.nama }), body);
  }));
  $('status').textContent = !loaded ? $('status').textContent : shown.length ? '' : 'Belum ada paket.';
}

function resetForm() {
  $('form').reset();
  editId = null;
  image = '';
  $('preview').hidden = true;
  $('cancelBtn').hidden = true;
  $('saveBtn').textContent = 'Simpan';
}

function showImage(src) {
  image = src;
  $('preview').src = src;
  $('preview').hidden = false;
}

function edit(item) {
  resetForm();
  editId = item.id;
  $('nama').value = item.nama;
  $('link').value = item.link;
  showImage(item.gambar);
  $('cancelBtn').hidden = false;
  $('saveBtn').textContent = 'Simpan perubahan';
  $('form').scrollIntoView({ behavior: 'smooth' });
}

async function remove(button, item) {
  if (!confirm('Hapus "' + item.nama + '"?')) return;
  button.disabled = true;
  try {
    items = await api({ action: 'hapus', password, id: item.id });
    if (editId === item.id) resetForm();
    render();
    toast('Paket dihapus.');
  } catch (err) { button.disabled = false; toast(errorText(err)); }
}

// Gambar diperkecil otomatis agar muat di satu sel Spreadsheet
async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    let size = 600, quality = 0.85, result;
    do {
      const scale = Math.min(1, size / Math.max(img.width, img.height));
      const canvas = el('canvas', {
        width: Math.max(1, Math.round(img.width * scale)),
        height: Math.max(1, Math.round(img.height * scale))
      });
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      result = canvas.toDataURL('image/jpeg', quality);
      if (quality > 0.6) quality -= 0.1; else size = Math.round(size * 0.85);
    } while (result.length > 48000);
    return result;
  } finally { URL.revokeObjectURL(url); }
}

async function pick(file) {
  if (!file) return;
  $('saveBtn').disabled = true;
  try { showImage(await compress(file)); }
  catch { toast('Gambar tidak didukung. Gunakan JPG atau PNG.'); }
  $('saveBtn').disabled = false;
}

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = e => { pick(e.target.files[0]); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };
// Cegah browser membuka file yang jatuh di luar kotak
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

$('form').onsubmit = async e => {
  e.preventDefault();
  if (!image) return toast('Masukkan gambar dulu.');
  // id disimpan agar klik ulang setelah gagal tidak membuat data ganda
  editId = editId || Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = { id: editId, nama: $('nama').value.trim(), gambar: image, link: $('link').value.trim() };
  const label = $('saveBtn').textContent;
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'Menyimpan...';
  try {
    items = await api({ action: 'simpan', password, item });
    resetForm();
    render();
    toast('Tersimpan.');
  } catch (err) {
    $('saveBtn').textContent = label;
    toast(errorText(err));
  }
  $('saveBtn').disabled = false;
};

$('adminBtn').onclick = () => {
  if (password) {
    password = '';
    resetForm();
    $('form').hidden = true;
    $('adminBtn').textContent = 'Admin';
    return render();
  }
  $('loginForm').hidden = !$('loginForm').hidden;
  $('password').focus();
};

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  try {
    const typed = $('password').value;
    items = await api({ action: 'login', password: typed });
    password = typed;
    loaded = true;
    $('loginForm').reset();
    $('loginForm').hidden = true;
    $('form').hidden = false;
    $('adminBtn').textContent = 'Keluar';
    render();
  } catch (err) { toast(errorText(err)); }
  $('loginBtn').disabled = false;
};

$('cancelBtn').onclick = resetForm;
$('search').oninput = render;

api().then(data => { items = data; loaded = true; render(); })
  .catch(err => { $('status').textContent = errorText(err); });
</script>
</body>
</html>
